<style>
  /* Tables: borders, header band, zebra rows, LEFT-aligned (matches body) */
  table { border-collapse: collapse; margin: 1em 0; }
  table th, table td {
    border: 1px solid #ccc;
    padding: 0.4em 0.8em;
    vertical-align: top;
  }
  table th { background-color: #ececec; font-weight: bold; }
  table tr:nth-child(even) td { background-color: #fafafa; }

  /* Blockquotes: italic by default (slidy's classic look) with a callout bar.
     Inline `*emphasis*` inside reverts to upright so it visually stands out. */
  blockquote {
    border-left: 4px solid #4a90d9;
    background-color: #f4f8fc;
    padding: 0.6em 1em;
    margin: 1em 0;
    color: #222;
    font-style: italic;
  }
  blockquote em, blockquote i { font-style: normal; }

  /* Figure captions */
  figure { text-align: center; }
  figcaption {
    font-size: 0.85em;
    color: #555;
    font-style: italic;
    margin-top: 0.3em;
  }

  /* Code blocks */
  pre {
    background-color: #f6f8fa;
    border: 1px solid #e0e0e0;
    border-radius: 4px;
    padding: 0.5em 0.8em;
  }
  code {
    background-color: #f0f0f0;
    padding: 0 0.25em;
    border-radius: 3px;
  }
  pre > code { background: none; padding: 0; }

  /* Mermaid: scale up font and node text to match slide body */
  div.mermaid { text-align: center; margin: 1em auto; font-size: 1.15em; }
  div.mermaid svg { max-width: 100%; height: auto; }
  div.mermaid .nodeLabel, div.mermaid .edgeLabel { font-size: 18px !important; }
</style>

<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
  mermaid.initialize({
    startOnLoad: false,
    theme: "default",
    securityLevel: "loose",
    fontSize: 18,
    flowchart: { useMaxWidth: true, htmlLabels: true }
  });
  const convertAndRun = async () => {
    document.querySelectorAll("pre.mermaid > code, pre > code.mermaid").forEach((code) => {
      const div = document.createElement("div");
      div.className = "mermaid";
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    try { await mermaid.run(); } catch (e) { console.error("mermaid.run failed:", e); }
  };
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", convertAndRun);
  } else {
    convertAndRun();
  }
</script>
